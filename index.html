<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Pic Generator</title>
  <style>
    :root {
      --bg1: #050816;
      --bg2: #0f172a;
      --bg3: #1e1b4b;
      --panel: rgba(15, 23, 42, 0.68);
      --panel-strong: rgba(15, 23, 42, 0.9);
      --accent: #8b5cf6;
      --accent2: #22d3ee;
      --accent3: #f472b6;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --button: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      --shadow: rgba(139, 92, 246, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.18), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(244, 114, 182, 0.22), transparent 24%),
        radial-gradient(circle at 50% 70%, rgba(139, 92, 246, 0.2), transparent 25%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    }

    body {
      padding: 36px 20px 50px;
      overflow-x: hidden;
    }

    .hero {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 32px;
      padding: 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent2), var(--accent3), var(--text));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .mini-tag {
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 7vw, 8rem);
      line-height: 0.88;
      letter-spacing: -0.07em;
    }

    .gradient-text {
      display: block;
      background: linear-gradient(90deg, var(--accent2), var(--accent3), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 22px 0 26px;
      max-width: 700px;
      color: var(--muted);
      font-size: clamp(1.1rem, 1.8vw, 1.7rem);
      line-height: 1.6;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 26px;
    }

    button {
      border: none;
      padding: 16px 22px;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    #generateBtn {
      background: var(--button);
      box-shadow: 0 18px 40px var(--shadow);
    }

    #copyBtn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: none;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 18px;
    }

    .stat {
      min-width: 130px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .stat strong {
      display: block;
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel {
      background: var(--panel-strong);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,0.44);
    }

    .link-box {
      width: 100%;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 0.85rem;
      word-break: break-all;
      min-height: 62px;
      display: flex;
      align-items: center;
    }

    .img-wrap {
      width: 100%;
      background: #020817;
    }

    img {
      display: block;
      width: 100%;
      height: 520px;
      object-fit: cover;
      background: linear-gradient(135deg, #0b1120, #1f2937);
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      img { height: 360px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="topbar">
      <div class="brand">Pic Forge</div>
      <div class="mini-tag">Random internet image</div>
    </div>

    <div class="layout">
      <div>
        <h1>
          Random
          <span class="gradient-text">art on demand</span>
        </h1>

        <p class="subtitle">
          Tap the button and magically generate a fresh image link from the internet.
          Zero setup. Pure chaos. Beautiful surprises.
        </p>

        <div class="controls">
          <button id="generateBtn">Generate Random Image</button>
          <button id="copyBtn">Copy Link</button>
        </div>

        <div class="stats">
          <div class="stat">
            <strong>∞</strong>
            <span>Variations</span>
          </div>
          <div class="stat">
            <strong>1 tap</strong>
            <span>Fresh vibe</span>
          </div>
          <div class="stat">
            <strong>Live</strong>
            <span>Online</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div id="linkBox" class="link-box">Loading a fresh image...</div>
        <div class="img-wrap">
          <img id="randomImage" alt="Random internet image" src="" />
        </div>
      </div>
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const linkBox = document.getElementById('linkBox');
    const image = document.getElementById('randomImage');

    function generateRandomUrl() {
      const seed = Math.random().toString(36).slice(2, 10);
      const width = 1200 + Math.floor(Math.random() * 700);
      const height = 900 + Math.floor(Math.random() * 500);
      return `https://picsum.photos/seed/${seed}/${width}/${height}`;
    }

    function loadRandomImage() {
      const url = generateRandomUrl();
      image.src = url;
      image.alt = 'Random internet image';
      linkBox.textContent = url;
    }

    generateBtn.addEventListener('click', loadRandomImage);

    copyBtn.addEventListener('click', async () => {
      const text = linkBox.textContent;
      if (!text || text.includes('Loading')) return;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Link';
        }, 1200);
      } catch (err) {
        copyBtn.textContent = 'Copy failed';
      }
    });

    loadRandomImage();
  </script>
</body>
</html>
