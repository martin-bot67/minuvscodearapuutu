<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pulse</title>
    <style>
        :root {
            --bg1: #0b1020;
            --bg2: #121b2d;
            --panel: rgba(18, 27, 45, 0.8);
            --neon: #7ef9ff;
            --pink: #ff4ecd;
            --purple: #9d7bff;
            --text: #edf6ff;
            --muted: #b4c3d9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(126, 249, 255, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255, 78, 205, 0.15), transparent 25%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(900px, 88vw);
            padding: 40px 32px;
            border: 1px solid rgba(126, 249, 255, 0.35);
            border-radius: 24px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(126, 249, 255, 0.12), 0 0 80px rgba(157, 123, 255, 0.14);
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--neon);
            background: rgba(126, 249, 255, 0.08);
            border: 1px solid rgba(126, 249, 255, 0.25);
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 6vw, 5.5rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
        }

        .gradient {
            background: linear-gradient(90deg, var(--neon), var(--pink), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.7;
            max-width: 600px;
            margin: 20px 0 28px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .button {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button.primary {
            color: #06131f;
            background: linear-gradient(90deg, var(--neon), #b5fff8);
            box-shadow: 0 10px 30px rgba
