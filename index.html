<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Bloom</title>
  <style>
    :root {
      color-scheme: dark;
      background: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="art" aria-label="A glowing ASCII flower slowly blooming in darkness"></canvas>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("art");
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const frameInterval = 1000 / 60;
      const glyphs = " .,:;!+*x%#@";
      const palette = [
        [16, 8, 34],
        [43, 15, 66],
        [92, 23, 105],
        [151, 34, 128],
        [211, 59, 132],
        [250, 103, 134],
        [255, 151, 144],
        [255, 194, 158],
        [255, 229, 191],
      ];
      const pollenPalette = [
        [93, 49, 18],
        [178, 103, 35],
        [237, 177, 80],
        [255, 226, 151],
      ];
      const petalLayers = [
        { count: 9, radius: 0.53, rotation: 0.08, shade: 0.02 },
        { count: 8, radius: 0.43, rotation: 0.31, shade: 0.08 },
        { count: 7, radius: 0.335, rotation: -0.15, shade: 0.14 },
        { count: 6, radius: 0.245, rotation: 0.22, shade: 0.2 },
      ];
      const sparks = Array.from({ length: 64 }, (_, i) => ({
        x: random(i + 11) * 2 - 1,
        y: random(i + 73) * 2 - 1,
        phase: random(i + 131) * Math.PI * 2,
        speed: 0.12 + random(i + 197) * 0.34,
        size: 0.4 + random(i + 263) * 1.15,
      }));
      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        cellW: 8,
        cellH: 15,
        fontSize: 12,
        time: 0,
        lastFrame: 0,
      };

      function random(seed) {
        const n = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
        return n - Math.floor(n);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function smoothstep(value) {
        const t = clamp(value, 0, 1);
        return t * t * (3 - 2 * t);
      }

      function resize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        const fontSize = clamp(Math.min(state.width / 138, state.height / 58), 6, 15);
        state.fontSize = fontSize;
        ctx.font = `600 ${fontSize}px "Courier New", monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        state.cellW = fontSize * 0.56;
        state.cellH = fontSize * 0.96;
      }

      function colorAt(colors, amount, alpha = 1) {
        const position = clamp(amount, 0, 0.9999) * (colors.length - 1);
        const index = Math.floor(position);
        const fraction = position - index;
        const a = colors[index];
        const b = colors[index + 1] || a;
        const r = Math.round(a[0] + (b[0] - a[0]) * fraction);
        const g = Math.round(a[1] + (b[1] - a[1]) * fraction);
        const blue = Math.round(a[2] + (b[2] - a[2]) * fraction);
        return `rgba(${r},${g},${blue},${alpha})`;
      }

      function render(timestamp) {
        if (!reducedMotion && state.lastFrame && timestamp - state.lastFrame < frameInterval) {
          requestAnimationFrame(render);
          return;
        }
        if (!reducedMotion) {
          const delta = state.lastFrame ? Math.min((timestamp - state.lastFrame) / 1000, 0.05) : 0;
          state.time += delta;
        } else {
          state.time = 9;
        }
        state.lastFrame = timestamp;

        const t = state.time;
        const bloom = smoothstep(t / 4.8);
        const breath = reducedMotion ? 1 : 0.985 + Math.sin(t * 0.72) * 0.015;
        const scale = Math.min(state.height * 0.76, state.width * 0.72);
        const centerX = state.width * 0.5;
        const centerY = state.height * 0.5;
        const wind = reducedMotion
          ? 0
          : (Math.sin(t * 0.52) + Math.sin(t * 1.17 + 1.4) * 0.32)
            * (0.82 + 0.18 * Math.max(0, Math.sin(t * 0.21 + 0.8)));
        const cols = Math.ceil(state.width / state.cellW);
        const rows = Math.ceil(state.height / state.cellH);
        const halfCols = cols / 2;
        const halfRows = rows / 2;
        const yaw = reducedMotion ? 0.2 : Math.sin(t * 0.2) * 0.36 + wind * 0.05;
        const pitch = 0.12 + (reducedMotion ? 0 : Math.sin(t * 0.27) * 0.035);
        const cosYaw = Math.cos(yaw);
        const sinYaw = Math.sin(yaw);
        const cosPitch = Math.cos(pitch);
        const sinPitch = Math.sin(pitch);
        const focalLength = 3.8;
        const projected = [];

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, state.width, state.height);

        for (const spark of sparks) {
          const drift = reducedMotion ? 0 : Math.sin(t * spark.speed + spark.phase);
          const x = (spark.x + drift * 0.035 + wind * 0.018) * state.width * 0.49 + centerX;
          const y = (spark.y + Math.cos(t * spark.speed * 0.8 + spark.phase) * 0.025) * state.height * 0.48 + centerY;
          const glint = 0.2 + (0.5 + 0.5 * Math.sin(t * 1.4 + spark.phase)) * 0.58;
          ctx.fillStyle = `rgba(255,199,177,${reducedMotion ? 0.36 : glint})`;
          ctx.fillText(spark.size > 1.15 ? "." : "·", x, y);
        }

        for (let row = 0; row < rows; row++) {
          const y = (row - halfRows) * state.cellH;
          const ny = (y - centerY * 0.02) / scale;
          for (let col = 0; col < cols; col++) {
            const x = (col - halfCols) * state.cellW;
            const nx = (x - centerX * 0.02) / scale;
            let glyph = " ";
            let color = "";
            let depth = 0;
            const flowerX = nx - wind * 0.018;
            const flowerY = ny;
            const radius = Math.hypot(flowerX, flowerY);
            const angle = Math.atan2(flowerY, flowerX);

            if (bloom > 0.015) {
              for (let layerIndex = 0; layerIndex < petalLayers.length; layerIndex++) {
                const layer = petalLayers[layerIndex];
                const layerBloom = smoothstep((t - layerIndex * 0.42) / 4.8);
                const radialWind = clamp(radius / Math.max(0.01, layer.radius), 0, 1);
                const windRipple = wind * radialWind;
                const rotatedAngle = angle - layer.rotation - windRipple * 0.12;
                const petalWave = (0.79 + 0.21 * Math.cos(rotatedAngle * layer.count)) * (1 + windRipple * 0.025);
                const petalEdge = layer.radius * petalWave * layerBloom * breath;
                if (radius >= petalEdge) continue;

                const radial = radius / Math.max(0.01, petalEdge);
                const nearestPetal = Math.round(rotatedAngle / (Math.PI * 2 / layer.count)) * (Math.PI * 2 / layer.count) + layer.rotation;
                const angleFromVein = Math.atan2(Math.sin(angle - nearestPetal), Math.cos(angle - nearestPetal));
                const veinDistance = Math.abs(Math.sin(angleFromVein)) * radius;
                const folds = Math.abs(Math.sin(angleFromVein * 6.5 + radial * 4));
                const edgeLight = Math.exp(-Math.pow((radial - 0.88) * 13, 2));
                const petalRidge = Math.exp(-Math.pow((radial - (0.48 + 0.08 * Math.sin(angleFromVein * 9))) * 28, 2));
                const fineRidge = Math.exp(-Math.pow((radial - (0.7 + 0.035 * Math.sin(angleFromVein * 15))) * 48, 2));
                const shimmer = 0.5 + 0.5 * Math.sin(t * 0.85 + nearestPetal * 3 + radial * 5 + wind * 0.5);
                const breezeFold = Math.sin(angle * 2.5 - t * 1.35 + radial * 4) * wind * radial * 0.09;
                const density = clamp((1 - radial) * 0.54 + folds * 0.15 + edgeLight * 0.17 + petalRidge * 0.16 + fineRidge * 0.12 + shimmer * 0.11 + breezeFold, 0, 1);
                const brightness = clamp(0.17 + (1 - radial) * 0.32 + folds * 0.11 + edgeLight * 0.17 + petalRidge * 0.21 + fineRidge * 0.15 + shimmer * 0.1 - layer.shade, 0, 1);
                const index = Math.min(glyphs.length - 1, 2 + Math.floor(density * 9));
                glyph = glyphs[index];
                const petalHue = clamp(brightness + 0.11 * Math.sin(nearestPetal * 2.4) + (layerIndex === 0 ? 0.06 : 0), 0, 1);
                color = colorAt(palette, petalHue);
                const petalDome = 0.3 * (1 - radial * radial);
                const petalFold = 0.04 * Math.cos(angleFromVein * 8 + radial * 5);
                const petalRim = -0.075 * Math.exp(-Math.pow((radial - 0.94) * 16, 2));
                depth = 0.015 + layerIndex * 0.028 + petalDome + petalFold + petalRim;

                if (radial > 0.15 && radial < 0.94) {
                  const centerVein = veinDistance < 0.0075;
                  const branchSide = angleFromVein < 0 ? -1 : 1;
                  const branchWave = 0.085 + radial * 0.24 + 0.025 * Math.sin(radial * 30 + nearestPetal * 5);
                  const branchOffset = angleFromVein - branchSide * branchWave;
                  const fineVein = Math.abs(branchOffset) * radius < 0.008 && radial > 0.2 && radial < 0.88;
                  const ridgeLine = fineRidge > 0.82 && folds > 0.45;
                  if (centerVein || fineVein || ridgeLine) {
                    glyph = centerVein ? (radial > 0.72 ? ":" : "+") : fineVein ? "." : "'";
                    color = colorAt(palette, Math.min(1, brightness + (centerVein ? 0.18 : fineVein ? 0.12 : 0.08)));
                  } else if (edgeLight > 0.48) {
                    glyph = ".";
                    color = colorAt(palette, Math.min(1, brightness + 0.14));
                  }
                }
              }
            }

            const coreRadius = Math.hypot(flowerX, flowerY);
            if (coreRadius < 0.12 * bloom && bloom > 0.1) {
              const stamenCount = 17;
              const stamenAngle = Math.round(angle * stamenCount / (Math.PI * 2)) * (Math.PI * 2 / stamenCount);
              const stamenOffset = Math.atan2(Math.sin(angle - stamenAngle), Math.cos(angle - stamenAngle));
              const stamenDistance = Math.abs(Math.sin(stamenOffset)) * coreRadius;
              const stamenTipDistance = Math.abs(coreRadius - 0.102 * bloom);
              const seedCount = 21;
              const seedStep = (Math.PI * 2) / seedCount;
              const seedIndex = Math.round(angle / seedStep);
              const seedAngle = seedIndex * seedStep;
              const seedRadius = 0.058 + Math.sin(seedIndex * 12.7) * 0.008 + Math.cos(seedIndex * 4.3) * 0.004;
              const seedDistance = Math.hypot(
                coreRadius - seedRadius,
                Math.sin(angle - seedAngle) * coreRadius
              );
              const coreRing = Math.abs(coreRadius - 0.032) < 0.005;
              if (coreRadius > 0.068 * bloom && coreRadius < 0.12 * bloom && stamenDistance < 0.0038 && stamenTipDistance < 0.028 * bloom) {
                glyph = stamenTipDistance < 0.008 * bloom ? "*" : ".";
                color = colorAt(pollenPalette, 0.72 + 0.24 * Math.sin(stamenAngle * 3 + t));
                depth = 0.27 + (1 - stamenTipDistance / (0.025 * bloom)) * 0.025;
              } else if (seedDistance < 0.012) {
                glyph = seedDistance < 0.006 ? "@" : "*";
                color = colorAt(pollenPalette, 0.65 + 0.32 * Math.sin(t * 1.4 + seedIndex));
                depth = 0.29;
              } else if (coreRing) {
                glyph = (row + col) % 2 === 0 ? "." : ":";
                color = colorAt(pollenPalette, 0.5 + coreRadius);
                depth = 0.26;
              } else {
                glyph = (row + col) % 3 === 0 ? "x" : "+";
                color = colorAt(palette, 0.88 + 0.1 * Math.sin(t * 2));
                depth = 0.24;
              }
            }

            if (glyph !== " ") {
              const localX = x / scale;
              const localY = y / scale;
              const rotatedX = localX * cosYaw - depth * sinYaw;
              const rotatedZ = localX * sinYaw + depth * cosYaw;
              const tiltedY = localY * cosPitch - rotatedZ * sinPitch;
              const viewDepth = localY * sinPitch + rotatedZ * cosPitch;
              const perspective = focalLength / (focalLength - viewDepth);
              const shade = clamp(0.8 + viewDepth * 0.56 + depth * 0.18, 0.48, 1.12);
              projected.push({
                glyph,
                color,
                depth: viewDepth,
                x: centerX + rotatedX * scale * perspective,
                y: centerY + tiltedY * scale * perspective,
                size: perspective,
                shade,
              });
            }
          }
        }

        projected.sort((a, b) => a.depth - b.depth);
        let lastFontSize = -1;
        for (const item of projected) {
          const fontSize = Math.max(5, Math.round(state.fontSize * item.size));
          if (fontSize !== lastFontSize) {
            ctx.font = `600 ${fontSize}px "Courier New", monospace`;
            lastFontSize = fontSize;
          }
          ctx.fillStyle = item.color.replace(/[\d.]+\)$/, `${item.shade})`);
          ctx.fillText(item.glyph, item.x, item.y);
        }

        ctx.font = `600 ${state.fontSize}px "Courier New", monospace`;
        if (!reducedMotion) requestAnimationFrame(render);
      }

      window.addEventListener("resize", resize);
      resize();
      if (reducedMotion) render(0);
      else requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
