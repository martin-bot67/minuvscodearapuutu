<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Pic Generator</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --card: rgba(15, 23, 42, 0.72);
      --accent: #7c3aed;
      --accent2: #22d3ee;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --button: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(124, 58, 237, 0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.22), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(960px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 32px;
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.3rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--button);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35);
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .link-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 20px;
      word-break: break-all;
      color: var(--muted);
      font-size: 0.95rem;
      min-height: 52px;
      display: flex;
      align-items: center;
    }

    .img-wrap {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }

    img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: cover;
      background: #0b1120;
    }

    @media (max-width: 600px) {
      .app { padding: 22px; }
      img { height: 260px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Random Picture Generator</h1>
    <p class="subtitle">Click the button to get a fresh image link from the internet.</p>

    <div class="controls">
      <button id="generateBtn">Generate Random Image</button>
      <button id="copyBtn" style="background: rgba(255,255,255,0.06); box-shadow: none; border: 1px solid rgba(255,255,255,0.1);">Copy Link</button>
    </div>

    <div id="linkBox" class="link-box">Waiting for a fresh image...</div>

    <div class="img-wrap">
      <img id="randomImage" alt="Random internet image" src="" />
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const linkBox = document.getElementById('linkBox');
    const image = document.getElementById('randomImage');

    function generateRandomUrl() {
      const seed = Math.random().toString(36).slice(2, 10);
      const width = 1200 + Math.floor(Math.random() * 600);
      const height = 800 + Math.floor(Math.random() * 500);
      return `https://picsum.photos/seed/${seed}/${width}/${height}`;
    }

    function loadRandomImage() {
      const url = generateRandomUrl();
      image.src = url;
      image.alt = 'Random internet image';
      linkBox.textContent = url;
    }

    generateBtn.addEventListener('click', loadRandomImage);

    copyBtn.addEventListener('click', async () => {
      const text = linkBox.textContent;
      if (!text || text.includes('Waiting')) return;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Link';
        }, 1200);
      } catch (err) {
        copyBtn.textContent = 'Copy failed';
      }
    });

    loadRandomImage();
  </script>
</body>
</html>
