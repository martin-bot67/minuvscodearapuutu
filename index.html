<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blooming Flower</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #05070d;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #05070d;
      touch-action: none;
    }

    /* Smooth glass pill styling */
    .glass-pill {
      background: rgba(12, 16, 28, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <div id="flower-stage" class="relative w-screen h-screen overflow-hidden select-none bg-[#05070d]">
    <canvas id="flower-canvas"></canvas>

    <!-- Minimal floating controls -->
    <div class="pointer-events-none fixed top-4 left-1/2 -translate-x-1/2 z-20 flex flex-wrap items-center justify-center gap-2 px-3">
      <div class="pointer-events-auto glass-pill rounded-full px-3 py-1.5 flex items-center gap-1.5 sm:gap-2">
        <button
          id="btn-rebloom"
          type="button"
          class="px-3 py-1 rounded-full text-xs font-medium text-white/90 hover:text-white hover:bg-white/10 active:scale-95 transition cursor-pointer"
        >
          Rebloom
        </button>

        <span class="w-px h-4 bg-white/15"></span>

        <button
          type="button"
          data-palette="lotus"
          aria-label="Lotus Pink palette"
          class="palette-btn w-5 h-5 rounded-full bg-gradient-to-tr from-rose-500 to-pink-200 ring-2 ring-white/80 transition cursor-pointer"
        ></button>
        <button
          type="button"
          data-palette="sunburst"
          aria-label="Sunburst Gold palette"
          class="palette-btn w-5 h-5 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-200 opacity-75 hover:opacity-100 transition cursor-pointer"
        ></button>
        <button
          type="button"
          data-palette="moonlight"
          aria-label="Moonlight Blue palette"
          class="palette-btn w-5 h-5 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-200 opacity-75 hover:opacity-100 transition cursor-pointer"
        ></button>
        <button
          type="button"
          data-palette="velvet"
          aria-label="Velvet Violet palette"
          class="palette-btn w-5 h-5 rounded-full bg-gradient-to-tr from-purple-600 to-fuchsia-200 opacity-75 hover:opacity-100 transition cursor-pointer"
        ></button>

        <span class="w-px h-4 bg-white/15"></span>

        <button
          id="btn-fullscreen"
          type="button"
          aria-pressed="false"
          class="px-3 py-1 rounded-full text-xs font-medium text-white/85 hover:text-white hover:bg-white/10 active:scale-95 transition cursor-pointer"
        >
          <span id="fs-label">Fullscreen</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // =====================================================================
      // 1. Color Palettes & Flower Configuration
      // =====================================================================
      const PALETTES = {
        lotus: {
          bgTop: "#060811",
          bgMid: "#0d1021",
          bgBottom: "#05070d",
          aura: "rgba(244, 114, 182, 0.16)",
          stemDark: "#133627",
          stemLight: "#348a63",
          leafDark: "#0f2d20",
          leafLight: "#3ca374",
          outerPetalDark: "#9d174d",
          outerPetalMid: "#ec4899",
          outerPetalLight: "#fbcfe8",
          innerPetalDark: "#be185d",
          innerPetalMid: "#f472b6",
          innerPetalLight: "#fdf2f8",
          coreGlow: "#fde047",
          pollen: "rgba(253, 224, 71, 0.72)",
        },
        sunburst: {
          bgTop: "#080705",
          bgMid: "#171108",
          bgBottom: "#050504",
          aura: "rgba(251, 191, 36, 0.16)",
          stemDark: "#1c331d",
          stemLight: "#4d8c45",
          leafDark: "#152916",
          leafLight: "#5ba34f",
          outerPetalDark: "#b45309",
          outerPetalMid: "#f59e0b",
          outerPetalLight: "#fef08a",
          innerPetalDark: "#d97706",
          innerPetalMid: "#fbbf24",
          innerPetalLight: "#fefce8",
          coreGlow: "#fff7ed",
          pollen: "rgba(254, 240, 138, 0.75)",
        },
        moonlight: {
          bgTop: "#040812",
          bgMid: "#09152b",
          bgBottom: "#03060c",
          aura: "rgba(56, 189, 248, 0.16)",
          stemDark: "#10323a",
          stemLight: "#2e7d8a",
          leafDark: "#0c262d",
          leafLight: "#3b96a6",
          outerPetalDark: "#1d4ed8",
          outerPetalMid: "#38bdf8",
          outerPetalLight: "#e0f2fe",
          innerPetalDark: "#0284c7",
          innerPetalMid: "#7dd3fc",
          innerPetalLight: "#f0f9ff",
          coreGlow: "#bae6fd",
          pollen: "rgba(186, 230, 253, 0.72)",
        },
        velvet: {
          bgTop: "#070510",
          bgMid: "#140b26",
          bgBottom: "#040309",
          aura: "rgba(192, 132, 252, 0.16)",
          stemDark: "#192933",
          stemLight: "#3c6e78",
          leafDark: "#132029",
          leafLight: "#4b8691",
          outerPetalDark: "#6b21a8",
          outerPetalMid: "#a855f7",
          outerPetalLight: "#f3e8ff",
          innerPetalDark: "#7e22ce",
          innerPetalMid: "#c084fc",
          innerPetalLight: "#faf5ff",
          coreGlow: "#f5d0fe",
          pollen: "rgba(245, 208, 254, 0.72)",
        },
      };

      // =====================================================================
      // 2. DOM References & State
      // =====================================================================
      const stage = document.getElementById("flower-stage");
      const canvas = document.getElementById("flower-canvas");
      const btnRebloom = document.getElementById("btn-rebloom");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const fsLabel = document.getElementById("fs-label");
      const paletteButtons = Array.from(document.querySelectorAll(".palette-btn"));

      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      const state = {
        paletteKey: "lotus",
        width: window.innerWidth || 1280,
        height: window.innerHeight || 720,
        dpr: 1,
        cols: 156,
        rows: 72,
        cellW: 9,
        cellH: 12,
        startTime: performance.now(),
        bloomStart: performance.now(),
        pointerX: 0,
        pointerY: 0,
        pointerActive: false,
        fallbackFullscreen: false,
        motes: [],
      };

      // Finer procedural glyph art ramp & multi-step color palettes for richer detail
      const GLYPH_RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
      const GLYPH_PALETTES = {
        lotus: ["#05070d", "#290717", "#5c0e33", "#9d174d", "#db2777", "#f472b6", "#fbcfe8", "#fdf2f8"],
        sunburst: ["#050504", "#2e1002", "#6b2606", "#b45309", "#d97706", "#f59e0b", "#fde047", "#fffbeb"],
        moonlight: ["#03060c", "#0f1c3f", "#1e3a8a", "#1d4ed8", "#0284c7", "#38bdf8", "#bae6fd", "#f0f9ff"],
        velvet: ["#040309", "#1e0a45", "#4c1d95", "#6b21a8", "#9333ea", "#c084fc", "#e9d5ff", "#faf5ff"],
      };
      const STEM_GLYPH_PALETTE = ["#05070d", "#081c13", "#102e20", "#174731", "#226647", "#348a63", "#52b788"];

      function clamp(val, lo, hi) {
        return val < lo ? lo : val > hi ? hi : val;
      }

      // Smooth cubic ease-out for organic petal unfurling
      function easeOutCubic(x) {
        const t = clamp(x, 0, 1);
        return 1 - Math.pow(1 - t, 3);
      }

      // Smooth ease-in-out for gentle breathing / swaying
      function easeInOutSine(x) {
        const t = clamp(x, 0, 1);
        return -(Math.cos(Math.PI * t) - 1) / 2;
      }

      function initMotes(count) {
        state.motes = [];
        for (let i = 0; i < count; i++) {
          state.motes.push({
            x: Math.random(),
            y: Math.random(),
            r: 0.8 + Math.random() * 2.1,
            speedY: 0.012 + Math.random() * 0.022,
            driftFreq: 0.5 + Math.random() * 1.1,
            driftAmp: 0.015 + Math.random() * 0.035,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.25 + Math.random() * 0.65,
          });
        }
      }

      initMotes(48);

      // =====================================================================
      // 3. Controls & Fullscreen
      // =====================================================================
      function setPalette(key) {
        if (!PALETTES[key]) return;
        state.paletteKey = key;
        paletteButtons.forEach((btn) => {
          const active = btn.dataset.palette === key;
          btn.classList.toggle("ring-2", active);
          btn.classList.toggle("ring-white/80", active);
          btn.classList.toggle("scale-110", active);
          btn.classList.toggle("opacity-75", !active);
        });
      }

      paletteButtons.forEach((btn) => {
        btn.addEventListener("click", () => setPalette(btn.dataset.palette));
      });

      if (btnRebloom) {
        btnRebloom.addEventListener("click", () => {
          state.bloomStart = performance.now();
        });
      }

      function getFsElement() {
        return (
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement ||
          null
        );
      }

      function syncFullscreenUI() {
        const isFs = Boolean(getFsElement()) || state.fallbackFullscreen;
        if (btnFullscreen) btnFullscreen.setAttribute("aria-pressed", String(isFs));
        if (fsLabel) fsLabel.textContent = isFs ? "Exit Fullscreen" : "Fullscreen";
        if (stage) {
          stage.classList.toggle("fixed", state.fallbackFullscreen && !getFsElement());
          stage.classList.toggle("inset-0", state.fallbackFullscreen && !getFsElement());
          stage.classList.toggle("z-40", state.fallbackFullscreen && !getFsElement());
        }
      }

      async function toggleFullscreen() {
        try {
          const current = getFsElement();
          if (current) {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            state.fallbackFullscreen = false;
            syncFullscreenUI();
            resize();
            return;
          }

          if (state.fallbackFullscreen) {
            state.fallbackFullscreen = false;
            syncFullscreenUI();
            resize();
            return;
          }

          const target = stage || canvas;
          if (target && target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target && target.webkitRequestFullscreen) {
            target.webkitRequestFullscreen();
          } else {
            state.fallbackFullscreen = true;
            syncFullscreenUI();
            resize();
          }
        } catch (_err) {
          state.fallbackFullscreen = !state.fallbackFullscreen;
          syncFullscreenUI();
          resize();
        }
      }

      if (btnFullscreen) {
        btnFullscreen.addEventListener("click", toggleFullscreen);
      }

      document.addEventListener("fullscreenchange", () => {
        if (!getFsElement()) state.fallbackFullscreen = false;
        syncFullscreenUI();
        requestAnimationFrame(resize);
      });

      document.addEventListener("webkitfullscreenchange", () => {
        if (!getFsElement()) state.fallbackFullscreen = false;
        syncFullscreenUI();
        requestAnimationFrame(resize);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.fallbackFullscreen && !getFsElement()) {
          state.fallbackFullscreen = false;
          syncFullscreenUI();
          resize();
        } else if (e.key.toLowerCase() === "r") {
          state.bloomStart = performance.now();
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        const nx = (e.clientX / Math.max(1, state.width)) * 2 - 1;
        const ny = (e.clientY / Math.max(1, state.height)) * 2 - 1;
        state.pointerX = clamp(nx, -1, 1);
        state.pointerY = clamp(ny, -1, 1);
        state.pointerActive = true;
      });

      canvas.addEventListener("pointerdown", (e) => {
        const nx = (e.clientX / Math.max(1, state.width)) * 2 - 1;
        const ny = (e.clientY / Math.max(1, state.height)) * 2 - 1;
        state.pointerX = clamp(nx, -1, 1);
        state.pointerY = clamp(ny, -1, 1);
        state.pointerActive = true;
      });

      canvas.addEventListener("pointerleave", () => {
        state.pointerActive = false;
      });

      // =====================================================================
      // 4. Responsive Canvas Sizing
      // =====================================================================
      function resize() {
        const rect = stage ? stage.getBoundingClientRect() : canvas.getBoundingClientRect();
        const w = Math.max(280, rect.width || window.innerWidth || 1280);
        const h = Math.max(240, rect.height || window.innerHeight || 720);
        const dpr = clamp(window.devicePixelRatio || 1, 1, 2);

        state.width = w;
        state.height = h;
        state.dpr = dpr;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Denser character grid for higher glyph resolution and finer detail
        const targetCols = w < 640 ? 104 : w < 1024 ? 144 : 176;
        state.cols = targetCols;
        state.cellW = w / state.cols;
        state.cellH = Math.max(9, state.cellW * 1.32);
        state.rows = Math.max(36, Math.ceil(h / state.cellH));

        const fontSize = Math.max(7, Math.floor(Math.min(state.cellW * 1.22, state.cellH * 0.98)));
        ctx.font = `700 ${fontSize}px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
      }

      resize();
      window.addEventListener("resize", resize);

      // =====================================================================
      // 5. Procedural Glyph-Grid Flower Field & Renderer
      // =====================================================================
      // Evaluates intensity [0..1] for the stem, central vein, and branching leaves
      function sampleStemAndLeaves(nx, ny, stemGrow, sway) {
        const baseX = 0.0;
        const baseY = 0.98;
        const tipX = sway * 0.14;
        const tipY = -0.08;
        const maxY = baseY + (tipY - baseY) * stemGrow;

        let best = 0;

        if (ny <= baseY && ny >= maxY) {
          const prog = clamp((baseY - ny) / Math.max(0.001, baseY - tipY), 0, 1);
          const curveX = baseX + (tipX - baseX) * Math.pow(prog, 0.85) + Math.sin(prog * Math.PI) * sway * 0.09;
          const distX = Math.abs(nx - curveX);
          const stemHalfW = 0.03 * (1.18 - prog * 0.35);
          if (distX < stemHalfW) {
            const core = 1.0 - distX / stemHalfW;
            const ridge = 0.85 + 0.15 * Math.cos(distX * 180);
            best = Math.max(best, core * ridge * (0.48 + 0.38 * prog));
          }

          // Two detailed leaves with midribs and side veins
          const leafProgress = clamp((stemGrow - 0.25) / 0.75, 0, 1);
          if (leafProgress > 0) {
            const leaves = [
              { t: 0.38, dir: -1, len: 0.44 * leafProgress, wid: 0.11 * leafProgress },
              { t: 0.62, dir: 1, len: 0.39 * leafProgress, wid: 0.1 * leafProgress },
            ];
            for (let i = 0; i < leaves.length; i++) {
              const lf = leaves[i];
              const lyAnchor = baseY - (baseY - tipY) * lf.t;
              const lxAnchor = baseX + (tipX - baseX) * Math.pow(lf.t, 0.85) + Math.sin(lf.t * Math.PI) * sway * 0.09;
              if (ny <= lyAnchor + 0.1 && ny >= lyAnchor - 0.18) {
                const lxTip = lxAnchor + lf.dir * lf.len;
                const lyTip = lyAnchor - lf.len * 0.3 + sway * 0.045;
                const u = clamp(((nx - lxAnchor) * lf.dir) / Math.max(0.001, lf.len), 0, 1);
                const spineY = lyAnchor + (lyTip - lyAnchor) * Math.pow(u, 0.85) - Math.sin(u * Math.PI) * 0.03;
                const envW = Math.sin(Math.pow(u, 0.78) * Math.PI) * lf.wid;
                const dyLeaf = ny - spineY;
                const absDy = Math.abs(dyLeaf);
                if (u > 0.015 && u < 0.995 && absDy < envW) {
                  const edgeFactor = 1.0 - absDy / Math.max(0.001, envW);
                  const midrib = Math.exp(-Math.pow(absDy / Math.max(0.004, envW * 0.12), 2)) * 0.25;
                  const sideVeins = 0.08 * Math.max(0, Math.cos((dyLeaf * 95 - u * lf.dir * 14) * Math.PI));
                  const val = (0.32 + 0.52 * edgeFactor + midrib + sideVeins) * (0.65 + 0.35 * u);
                  best = Math.max(best, clamp(val, 0, 0.999));
                }
              }
            }
          }
        }

        return best;
      }

      // Evaluates intensity [0..1] for multi-layered petals, veins, and stamen core
      function sampleFlowerHead(dx, dy, radiusNorm, bloomProgress, time) {
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);
        const breathe = 1.0 + 0.035 * Math.sin(time * 1.6);
        const rMax = radiusNorm * breathe;

        // Three petal tiers unfurl sequentially for richer depth
        const outerOpen = easeOutCubic(clamp((bloomProgress - 0.06) / 0.62, 0, 1));
        const midOpen = easeOutCubic(clamp((bloomProgress - 0.22) / 0.65, 0, 1));
        const innerOpen = easeOutCubic(clamp((bloomProgress - 0.38) / 0.62, 0, 1));
        const coreOpen = easeOutCubic(clamp((bloomProgress - 0.42) / 0.58, 0, 1));

        let val = 0;

        // Tier 1: Wide outer petals (10 lobes) with delicate radial veins
        const outerPetals = 10;
        const outerReach = rMax * (0.28 + 0.76 * outerOpen);
        const outerPhase = angle * outerPetals + Math.sin(time * 0.5) * 0.08;
        const outerWave = 0.5 + 0.5 * Math.cos(outerPhase);
        const outerRadius = outerReach * (0.52 + 0.48 * Math.pow(outerWave, 0.68));
        if (dist <= outerRadius) {
          const radial = 1.0 - dist / Math.max(0.001, outerRadius);
          const vein = 0.8 + 0.2 * Math.cos(outerPhase * 2.5 + dist * 28);
          const rib = 0.72 + 0.28 * Math.cos(outerWave * Math.PI);
          val = Math.max(val, (0.26 + 0.52 * radial) * rib * vein * (0.35 + 0.65 * outerOpen));
        }

        // Tier 2: Mid-layer petals (8 lobes, offset angle)
        const midPetals = 8;
        const midReach = rMax * (0.22 + 0.66 * midOpen);
        const midPhase = angle * midPetals + 0.38 + Math.cos(time * 0.45) * 0.07;
        const midWave = 0.5 + 0.5 * Math.cos(midPhase);
        const midRadius = midReach * (0.5 + 0.5 * Math.pow(midWave, 0.7));
        if (dist <= midRadius) {
          const radial = 1.0 - dist / Math.max(0.001, midRadius);
          const vein = 0.82 + 0.18 * Math.cos(midPhase * 2.5 - dist * 24);
          const rib = 0.74 + 0.26 * Math.cos(midWave * Math.PI);
          val = Math.max(val, (0.4 + 0.48 * radial) * rib * vein * (0.35 + 0.65 * midOpen));
        }

        // Tier 3: Inner crown petals (6 lobes)
        const innerPetals = 6;
        const innerReach = rMax * (0.16 + 0.48 * innerOpen);
        const innerPhase = angle * innerPetals - time * 0.14;
        const innerWave = 0.5 + 0.5 * Math.cos(innerPhase);
        const innerRadius = innerReach * (0.48 + 0.52 * Math.pow(innerWave, 0.72));
        if (dist <= innerRadius) {
          const radial = 1.0 - dist / Math.max(0.001, innerRadius);
          const rib = 0.78 + 0.22 * Math.cos(innerWave * Math.PI);
          val = Math.max(val, (0.54 + 0.4 * radial) * rib * (0.35 + 0.65 * innerOpen));
        }

        // Detailed stamen ring & glowing center
        const coreR = rMax * 0.19 * (0.25 + 0.75 * coreOpen);
        if (dist <= coreR * 1.65 && coreOpen > 0.02) {
          const coreFalloff = clamp(1.0 - dist / (coreR * 1.65), 0, 1);
          const stamenRays = 0.75 + 0.25 * Math.cos(angle * 24.0 + time * 2.2);
          const dotRing = Math.exp(-Math.pow((dist - coreR * 0.65) / Math.max(0.004, coreR * 0.22), 2)) * 0.25;
          val = Math.max(val, (coreFalloff * stamenRays + dotRing) * coreOpen);
        }

        return clamp(val, 0, 0.999);
      }

      // =====================================================================
      // 6. Main Glyph-Grid Animation Loop
      // =====================================================================
      let lastNow = performance.now();

      function frame(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
        lastNow = now;

        const time = (now - state.startTime) / 1000;
        const elapsedBloom = (now - state.bloomStart) / 1000;

        // Smoothly opens over ~5.5 seconds from bud to full blossom
        const bloomProgress = easeInOutSine(clamp(elapsedBloom / 5.5, 0, 1));
        const stemGrow = easeOutCubic(clamp(elapsedBloom / 2.2, 0, 1));

        const pal = PALETTES[state.paletteKey] || PALETTES.lotus;
        const flowerPal = GLYPH_PALETTES[state.paletteKey] || GLYPH_PALETTES.lotus;

        // Pure dark background
        ctx.fillStyle = pal.bgBottom;
        ctx.fillRect(0, 0, state.width, state.height);

        const targetTiltX = state.pointerActive ? state.pointerX * 0.45 : 0;
        const targetTiltY = state.pointerActive ? state.pointerY * 0.35 : 0;
        const sway = Math.sin(time * 1.1) * 0.35 + targetTiltX;

        const aspect = state.width / Math.max(1, state.height);
        // Larger blossom scale so the flower fills the canvas with rich detail
        const radiusNorm = clamp(0.62 / Math.max(0.8, aspect * 0.56), 0.32, 0.62);
        const flowerCenterX = sway * 0.14;
        const flowerCenterY = -0.09 + targetTiltY * 0.08;

        const cw = state.cellW;
        const ch = state.cellH;
        const rampMax = GLYPH_RAMP.length - 1;
        const flowerPalMax = flowerPal.length - 1;
        const stemPalMax = STEM_GLYPH_PALETTE.length - 1;

        const activeMotes = [];
        for (let i = 0; i < state.motes.length; i++) {
          const m = state.motes[i];
          m.y -= m.speedY * dt;
          if (m.y < -0.1) {
            m.y = 1.1;
            m.x = Math.random();
          }
          const mx = (((m.x + Math.sin(time * m.driftFreq + m.phase) * m.driftAmp) * 2.0 - 1.0)) * aspect;
          const my = m.y * 2.0 - 1.0;
          const pulse = 0.6 + 0.4 * Math.sin(time * 2.4 + m.phase);
          activeMotes.push({
            x: mx,
            y: my,
            strength: clamp(m.alpha * pulse * easeOutCubic(clamp(bloomProgress * 1.4, 0, 1)), 0, 1),
          });
        }

        for (let r = 0; r < state.rows; r++) {
          const ny = ((r + 0.5) / state.rows) * 2.0 - 1.0;
          const cy = (r + 0.5) * ch;

          for (let c = 0; c < state.cols; c++) {
            const nx = (((c + 0.5) / state.cols) * 2.0 - 1.0) * aspect;
            const cx = (c + 0.5) * cw;

            let glyph = " ";
            let color = pal.bgBottom;

            const flowerVal =
              stemGrow > 0.2
                ? sampleFlowerHead(nx - flowerCenterX, ny - flowerCenterY, radiusNorm, bloomProgress, time)
                : 0;

            if (flowerVal > 0.08) {
              const rIdx = clamp(Math.floor(flowerVal * rampMax), 1, rampMax);
              const cIdx = clamp(Math.floor(flowerVal * flowerPalMax), 1, flowerPalMax);
              glyph = GLYPH_RAMP[rIdx];
              color = flowerPal[cIdx];
            } else {
              const stemVal = sampleStemAndLeaves(nx, ny, stemGrow, sway);
              if (stemVal > 0.08) {
                const rIdx = clamp(Math.floor(stemVal * rampMax), 1, rampMax);
                const cIdx = clamp(Math.floor(stemVal * stemPalMax), 1, stemPalMax);
                glyph = GLYPH_RAMP[rIdx];
                color = STEM_GLYPH_PALETTE[cIdx];
              } else {
                // Check nearby floating pollen motes
                for (let m = 0; m < activeMotes.length; m++) {
                  const mote = activeMotes[m];
                  const d = Math.hypot(nx - mote.x, ny - mote.y);
                  if (d < 0.045) {
                    const glow = (1.0 - d / 0.045) * mote.strength;
                    if (glow > 0.22) {
                      glyph = glow > 0.65 ? "*" : "+";
                      color = flowerPal[Math.min(flowerPalMax, flowerPalMax - 1)];
                    }
                    break;
                  }
                }
              }
            }

            if (glyph !== " ") {
              ctx.fillStyle = color;
              ctx.fillText(glyph, cx, cy);
            }
          }
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
