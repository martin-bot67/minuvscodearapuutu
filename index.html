<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Figure — 3D Symbol Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap');

    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f8fafc;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #000000;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #figure-stage:fullscreen {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <div id="figure-stage" class="relative w-screen h-screen bg-black flex flex-col items-center justify-between p-2 sm:p-4 overflow-hidden select-none">
    <!-- Centered Canvas Viewport -->
    <div id="canvas-wrap" class="relative flex-1 w-full max-w-[1900px] min-h-0 flex items-center justify-center mb-2">
      <canvas id="figure-canvas"></canvas>
    </div>

    <!-- Bottom Control Bar: Spin/Pause + Fullscreen + Color Themes -->
    <div class="z-10 flex flex-wrap items-center justify-center gap-2 bg-black/90 border border-neutral-800 rounded-xl px-3 py-2">
      <button id="btn-spin" type="button" aria-pressed="true" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 hover:bg-neutral-800 text-white border border-neutral-700 transition cursor-pointer">
        <span id="spin-label">Pause Spin</span>
      </button>

      <button id="btn-fullscreen" type="button" aria-pressed="false" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 hover:bg-neutral-800 text-white border border-neutral-700 transition cursor-pointer">
        <span id="fs-label">Fullscreen</span>
      </button>

      <div class="h-4 w-px bg-neutral-800 mx-0.5"></div>

      <button type="button" data-color="cyan" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-cyan-300 border border-neutral-800 hover:border-cyan-500/60 transition cursor-pointer">
        Cyan
      </button>
      <button type="button" data-color="crimson" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-rose-300 border border-neutral-800 hover:border-rose-500/60 transition cursor-pointer">
        Crimson
      </button>
      <button type="button" data-color="emerald" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-emerald-300 border border-neutral-800 hover:border-emerald-500/60 transition cursor-pointer">
        Emerald
      </button>
      <button type="button" data-color="amber" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-amber-300 border border-neutral-800 hover:border-amber-500/60 transition cursor-pointer">
        Amber
      </button>
      <button type="button" data-color="violet" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-violet-300 border border-neutral-800 hover:border-violet-500/60 transition cursor-pointer">
        Violet
      </button>
    </div>
  </div>

        "                        ..;.                 +#####= ##############X.......;X+....;+#M=+#;..........X#;     ;;.;==;;.  ;==.",

        "    =.       .;===;.==;; .;;. .=                 M#;............;X+M#XX+=;;=+X#X=  +M=..........;#X            =;==                       ;=.;",
        "   =. ;X=..;;;;;;;;;;.       ;;                  ;#M............;=..=M##MMMM#+.  ;MM;...........MM.              .==.;+;             .=+; ;",
        "  +=.;.                     ;.                    X#=...........+;...;=M####;  .+MX;...........=#+                 .=. .;;.  ..;;  ;;; ",
        "  .                       ;;                      .MM;.........;M.......;=XMM+MMX;........=...;MX                    .=                ",
        "                         =.                        ;MM;......;+M;...........;==...........=..;M#                       =;              ",
        "                        ;.                          ;#M;....++=..........................;;..X#;                        .=             ",
        "                      .=                             =#M.................................X.;M#=      ;                    ;.            ",
        "                     .;                  .=           =MM;..............................===##=       ;=                    ;.           ",
        "                    ;;                  =;             ;#M=.............................X+##;          =.                   ..          ",
        "                   ..                  =                ;M#X;................+;.......;M##M;            ;;                   ..         ",
        "                  ;;                 ;;                   +##X;...............++=...=X##M=                =.                  ..        ",
        "                 ;.                .+.                     ;X##X=..............;=+MM###+.                  =;                  .;       ",
        "                =                 ;+.                        .XM#MX;;;.........;;XM#MX.                     ;.=.                .;      ",
        "               ;               ..;+                             +X####M+====+MM###X=                         ; ;;;               ;.    ",
        "             ;.              ... ;               +.               .;;XX######MX;;.             .              ;  ..=.             ;   ",
        "            ;.             ;.   ;               =.                     ......                   =             ;;     ==            =   ",
        "          .=           ..=.    ;              .+                                                .=             ;.       =;;        ..",
        "         ..         ;; ;      ;               X.                                                 .;             ;         ..;       ;.",
        "       +.     . ;=+          ;               ++                                                   ;;             .            +      ;",

        "  ;;=;=. ;;                ;.             . ;.          .;                             ;           .;;            ;              .;   ;",
        " .                         ;             ;  ;           X           +                  ;            ;;=            =               .; ..",
        "                          =            .;  ;           .=          .=         ;         ;            = =.          ..               .= ;",
        "                         ;.          ;;    ;           ==          .;         +         ;.            . ..          ;                 ==.",
        "                         =         .;     =           ..;          =;         X          +            ;  .=          .                 ;=",
        "                        ;       . .       ;           ;            =;         =          =;            ;   =.        =                  =",
        "                       ..     .;.        ;           ..;           .;         =;         .;            .    .=        ;",
        "                       ;    .;           ;           . +          ;.;         .           ;.            ;     =.      .",
        "                      ..   .            ;           =  +          . .         .;          .;            ;      ...     ;",
        "                      ;  .;             ;          ;   ;          . .           .         . .           ..       ;;    ..",
        "                     .. =              ..         .    ;         .  .           ;         ;; =           ;         ;.   =",
        "                     ;.=               =         ;.              ;  =         .  ;         . .;          .           ;;  =",
        "                    .+.                ;        ;.              ..  +         ;  .            ;.          .           ;;  .",
        "                    .                 =        ;.               ;   ;         ;   .        =   ;          =             ;.=",
        "                                      ;       ;.               ..   .         ;   ;.       ;.   ;         ;              .=.",
        "                                     ;       ..                ;              +    ;       ..    .        .;              .+",
        "                                     ;      ;                 .;    ;         ;     ;             .        .                +",
        "                                    =      =                  ;     .;        ;     ;.      ;      .       ;",
        "                                   .      ;                   =      .               ;      ;       .       .",
        "                                  .;    =.             ;      =      .       =        ;     ;        ;.     .",
        "                                  =   ..               ;     ;       ;       =        ;     ;         ;     =",
        "                                 ;  .;                 +     +       =.      .         ;    +          ;    ;",
        "                                .. ;;                  ;     .       .      ..         ;    X                ",
        "                               .==.                         .         .     ;           ;   =                ;",
        "                              .+.                       .   =         ;                 =   ;            .   +",
        "                                                        =   .         +    .;           ..  ;             ;  .",
        "                                                        ;   .         =    .             ;  ;              ;",
        "                                                            ;         ;    ;             =                  ;..",
        "                                                         . ;              ..             ..                 ;.=",
        "                                                         . ;              .               =..                =.",
        "                                                                          .               ;;                 .;",
        "                                                         ;.;             =                .;                  +",
        "                                                          .;                              ..",
        "                                                          +X            =                 ;=",
        "                                                           +            .                 .;",
        "                                                           .           .",
        "                                                                      =;",
        "                                                                      .  ",
      ];

      // Density weights aligned with characters present in the source artwork
      const CHAR_DENSITY = {
        " ": 0.0,
        ".": 0.14,
        ":": 0.25,
        ";": 0.36,
        "=": 0.48,
        "+": 0.58,
        "X": 0.72,
        "M": 0.86,
        "#": 1.0,
      };

      const DENSITY_RAMP = " .:;+=XM#";

      // Color palettes for each theme
      const COLOR_THEMES = {
        crimson: {
          activeClasses: ["bg-rose-950", "text-rose-200", "border-rose-400"],
          palette: ["#0b0305", "#3b0712", "#7f1d1d", "#b91c1c", "#e11d48", "#fb7185", "#fda4af", "#fff1f2"],
        },
        cyan: {
          activeClasses: ["bg-cyan-950", "text-cyan-200", "border-cyan-400"],
          palette: ["#040811", "#0c2340", "#172554", "#1d4ed8", "#0284c7", "#22d3ee", "#a5f3fc", "#f8fafc"],
        },
        emerald: {
          activeClasses: ["bg-emerald-950", "text-emerald-200", "border-emerald-400"],
          palette: ["#030c08", "#052e1f", "#064e3b", "#047857", "#059669", "#10b981", "#6ee7b7", "#ecfdf5"],
        },
        amber: {
          activeClasses: ["bg-amber-950", "text-amber-200", "border-amber-400"],
          palette: ["#0c0702", "#2e1303", "#451a03", "#92400e", "#d97706", "#f59e0b", "#fcd34d", "#fffbeb"],
        },
        violet: {
          activeClasses: ["bg-violet-950", "text-violet-200", "border-violet-400"],
          palette: ["#070411", "#1e0b3d", "#2e1065", "#5b21b6", "#7c3aed", "#a855f7", "#d8b4fe", "#faf5ff"],
        },
      };

      const ALL_ACTIVE_CLASSES = Object.values(COLOR_THEMES).flatMap((t) => t.activeClasses);

      // =====================================================================
      // 2. Build Sampled 136x58 Grid From Source ASCII Artwork
      // =====================================================================
      const TARGET_COLS = 136;
      const TARGET_ROWS = 58;
      const SRC_ROWS = RAW_ART.length;
      const SRC_COLS = RAW_ART.reduce((maxLen, line) => Math.max(maxLen, line.length), 0);

      // Sample source ASCII artwork into TARGET_COLS x TARGET_ROWS while preserving dense glyphs
      const gridCells = [];
      for (let r = 0; r < TARGET_ROWS; r++) {
        const y0 = Math.floor((r / TARGET_ROWS) * SRC_ROWS);
        const y1 = Math.max(y0 + 1, Math.ceil(((r + 1) / TARGET_ROWS) * SRC_ROWS));
        const rowArr = [];

        for (let c = 0; c < TARGET_COLS; c++) {
          const x0 = Math.floor((c / TARGET_COLS) * SRC_COLS);
          const x1 = Math.max(x0 + 1, Math.ceil(((c + 1) / TARGET_COLS) * SRC_COLS));

          let bestChar = " ";
          let bestWeight = 0;
          let sumWeight = 0;
          let count = 0;

          for (let sy = y0; sy < y1 && sy < SRC_ROWS; sy++) {
            const line = RAW_ART[sy];
            for (let sx = x0; sx < x1 && sx < line.length; sx++) {
              const ch = line[sx];
              const w = Object.prototype.hasOwnProperty.call(CHAR_DENSITY, ch)
                ? CHAR_DENSITY[ch]
                : ch.trim()
                  ? 0.45
                  : 0.0;
              sumWeight += w;
              count++;
              if (w > bestWeight) {
                bestWeight = w;
                bestChar = ch;
              }
            }
          }

          const avgWeight = count > 0 ? sumWeight / count : 0;
          // Blend peak and average density so dense regions (#, M, X) remain crisp and legible
          const density = bestWeight > 0 ? clamp(bestWeight * 0.72 + avgWeight * 0.28, 0.08, 1.0) : 0.0;

          rowArr.push({
            char: bestWeight > 0 ? bestChar : " ",
            density,
          });
        }
        gridCells.push(rowArr);
      }

      // =====================================================================
      // 3. DOM References, State & Controls
      // =====================================================================
      const stage = document.getElementById("figure-stage");
      const wrap = document.getElementById("canvas-wrap");
      const canvas = document.getElementById("figure-canvas");
      const btnSpin = document.getElementById("btn-spin");
      const spinLabel = document.getElementById("spin-label");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const fsLabel = document.getElementById("fs-label");
      const colorButtons = Array.from(document.querySelectorAll(".color-btn"));

      if (!canvas || !wrap) return;
      const ctx = canvas.getContext("2d", { alpha: false });
      if (!ctx) return;

      const state = {
        activeColor: "cyan",
        spinning: true,
        yaw: 0,
        spinVelocity: 0.72,
        boostVelocity: 0,
        tiltX: 0.14,
        dragging: false,
        lastX: 0,
        lastY: 0,
        fallbackFullscreen: false,
        cssWidth: 1200,
        cssHeight: 600,
        cellW: 10,
        cellH: 10,
        baseFontSize: 12,
        startTime: performance.now(),
        lastFrameTime: performance.now(),
      };

      function clamp(val, lo, hi) {
        return val < lo ? lo : val > hi ? hi : val;
      }

      function getPalette() {
        return (COLOR_THEMES[state.activeColor] || COLOR_THEMES.cyan).palette;
      }

      function setColor(colorKey) {
        if (!COLOR_THEMES[colorKey]) return;
        state.activeColor = colorKey;

        colorButtons.forEach((btn) => {
          const isSelected = btn.dataset.color === colorKey;
          btn.classList.remove(...ALL_ACTIVE_CLASSES);
          if (isSelected) {
            btn.classList.remove("bg-neutral-900", "border-neutral-800");
            btn.classList.add(...COLOR_THEMES[colorKey].activeClasses);
          } else {
            btn.classList.add("bg-neutral-900", "border-neutral-800");
          }
        });
      }

      colorButtons.forEach((btn) => {
        btn.addEventListener("click", () => setColor(btn.dataset.color));
      });
      setColor("cyan");

      function updateSpinButton() {
        if (btnSpin) btnSpin.setAttribute("aria-pressed", String(state.spinning));
        if (spinLabel) spinLabel.textContent = state.spinning ? "Pause Spin" : "Resume Spin";
      }

      if (btnSpin) {
        btnSpin.addEventListener("click", () => {
          state.spinning = !state.spinning;
          updateSpinButton();
        });
      }
      updateSpinButton();

      // Pointer drag-to-spin boost and subtle vertical tilt adjustment
      canvas.addEventListener("pointerdown", (e) => {
        state.dragging = true;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!state.dragging) return;
        const dx = e.clientX - state.lastX;
        const dy = e.clientY - state.lastY;
        state.lastX = e.clientX;
        state.lastY = e.clientY;

        state.yaw += dx * 0.012;
        state.boostVelocity = clamp(state.boostVelocity + dx * 0.045, -7.5, 7.5);
        state.tiltX = clamp(state.tiltX + dy * 0.004, -0.45, 0.45);
      });

      function endDrag(e) {
        if (!state.dragging) return;
        state.dragging = false;
        if (e && typeof e.pointerId === "number" && canvas.hasPointerCapture(e.pointerId)) {
          canvas.releasePointerCapture(e.pointerId);
        }
      }

      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      // Fullscreen management with sandbox fallback
      function getFsElement() {
        return (
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement ||
          null
        );
      }

      function updateFsButton() {
        const active = Boolean(getFsElement()) || state.fallbackFullscreen;
        if (btnFullscreen) btnFullscreen.setAttribute("aria-pressed", String(active));
        if (fsLabel) fsLabel.textContent = active ? "Exit Fullscreen" : "Fullscreen";
        if (stage) {
          stage.classList.toggle("fixed", state.fallbackFullscreen && !getFsElement());
          stage.classList.toggle("inset-0", state.fallbackFullscreen && !getFsElement());
          stage.classList.toggle("z-50", state.fallbackFullscreen && !getFsElement());
        }
      }

      async function toggleFullscreen() {
        try {
          const current = getFsElement();
          if (current) {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            state.fallbackFullscreen = false;
            updateFsButton();
            resize();
            return;
          }

          if (state.fallbackFullscreen) {
            state.fallbackFullscreen = false;
            updateFsButton();
            resize();
            return;
          }

          const target = stage || canvas;
          if (target && target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target && target.webkitRequestFullscreen) {
            target.webkitRequestFullscreen();
          } else {
            state.fallbackFullscreen = true;
            updateFsButton();
            resize();
          }
        } catch (_err) {
          state.fallbackFullscreen = !state.fallbackFullscreen;
          updateFsButton();
          resize();
        }
      }

      if (btnFullscreen) {
        btnFullscreen.addEventListener("click", toggleFullscreen);
      }

      document.addEventListener("fullscreenchange", () => {
        if (!getFsElement()) state.fallbackFullscreen = false;
        updateFsButton();
        requestAnimationFrame(resize);
      });

      document.addEventListener("webkitfullscreenchange", () => {
        if (!getFsElement()) state.fallbackFullscreen = false;
        updateFsButton();
        requestAnimationFrame(resize);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.fallbackFullscreen && !getFsElement()) {
          state.fallbackFullscreen = false;
          updateFsButton();
          resize();
        }
      });

      // =====================================================================
      // 4. Responsive Canvas Sizing for 136x58 Grid
      // =====================================================================
      function resize() {
        const rect = wrap.getBoundingClientRect();
        const availW = Math.max(240, rect.width || window.innerWidth || 960);
        const availH = Math.max(160, rect.height || window.innerHeight || 480);

        // Preserve monospace cell proportions across 136 cols x 58 rows
        const targetRatio = (TARGET_COLS * 10.5) / (TARGET_ROWS * 16);
        let drawW = availW;
        let drawH = drawW / targetRatio;

        if (drawH > availH) {
          drawH = availH;
          drawW = drawH * targetRatio;
        }

        const dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
        state.cssWidth = Math.floor(drawW);
        state.cssHeight = Math.floor(drawH);

        canvas.style.width = `${state.cssWidth}px`;
        canvas.style.height = `${state.cssHeight}px`;
        canvas.width = Math.round(state.cssWidth * dpr);
        canvas.height = Math.round(state.cssHeight * dpr);

        state.cellW = state.cssWidth / TARGET_COLS;
        state.cellH = state.cssHeight / TARGET_ROWS;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const fontSize = Math.max(7, Math.floor(Math.min(state.cellW * 1.25, state.cellH * 0.98)));
        state.baseFontSize = fontSize;
        ctx.font = `700 ${fontSize}px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
      }

      resize();
      window.addEventListener("resize", resize);
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(resize).observe(wrap);
      }

      // =====================================================================
      // 5. 3D-Spinning Glyph-Grid Sculpture Renderer
      // =====================================================================
      function render(now) {
        const dt = Math.min(0.05, Math.max(0, (now - state.lastFrameTime) / 1000));
        state.lastFrameTime = now;
        const t = (now - state.startTime) / 1000;

        // Advance continuous Y-axis spin plus any drag boost impulse
        if (state.spinning) {
          state.yaw += (state.spinVelocity + state.boostVelocity) * dt;
        } else {
          state.yaw += state.boostVelocity * dt;
        }
        state.boostVelocity *= Math.pow(0.08, dt);

        const palette = getPalette();
        const palMax = palette.length - 1;
        const rampMax = DENSITY_RAMP.length - 1;

        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, state.cssWidth, state.cssHeight);

        const cw = state.cellW;
        const ch = state.cellH;
        const halfCols = (TARGET_COLS - 1) * 0.5;
        const halfRows = (TARGET_ROWS - 1) * 0.5;
        const centerX = state.cssWidth * 0.5;
        const centerY = state.cssHeight * 0.5;

        const cosY = Math.cos(state.yaw);
        const sinY = Math.sin(state.yaw);
        const effectiveTilt = state.tiltX + Math.sin(t * 0.85) * 0.08;
        const cosT = Math.cos(effectiveTilt);
        const sinT = Math.sin(effectiveTilt);

        // Slight sculptural curvature depth across horizontal and vertical coordinates
        const depthSpan = Math.min(state.cssWidth, state.cssHeight) * 0.42;
        const fov = depthSpan * 2.35;

        // Project every active glyph cell into 3D space and painter-sort back-to-front
        const projected = [];

        for (let r = 0; r < TARGET_ROWS; r++) {
          const normY = (r - halfRows) / Math.max(1, halfRows);
          const y0 = (r - halfRows) * ch;

          for (let c = 0; c < TARGET_COLS; c++) {
            const cell = gridCells[r][c];
            if (cell.density <= 0.01) continue;

            const normX = (c - halfCols) / Math.max(1, halfCols);
            const x0 = (c - halfCols) * cw * 1.15;

            // Gentle relief depth tied to cell density and subtle cylindrical curve
            const reliefZ = (cell.density - 0.35) * 0.28 + (1.0 - normX * normX * 0.35) * 0.14;
            const z0 = reliefZ * depthSpan;

            // Rotate around Y axis
            const xRotY = x0 * cosY + z0 * sinY;
            const zRotY = -x0 * sinY + z0 * cosY;

            // Apply subtle 3D vertical tilt around X axis
            const yRot = y0 * cosT - zRotY * sinT;
            const zFinal = y0 * sinT + zRotY * cosT;

            // Perspective projection
            const denom = Math.max(120, fov + zFinal);
            const scale = fov / denom;
            const sx = centerX + xRotY * scale;
            const sy = centerY + yRot * scale;

            if (sx < -cw * 2 || sx > state.cssWidth + cw * 2 || sy < -ch * 2 || sy > state.cssHeight + ch * 2) {
              continue;
            }

            // Normalized depth [-1 (front) .. +1 (back)] for brightness and back-face shading
            const depthNorm = clamp(zFinal / Math.max(1, depthSpan * 1.15), -1.2, 1.2);
            const frontFactor = clamp(0.54 - depthNorm * 0.46, 0.18, 1.0);
            const backDim = depthNorm > 0.15 ? clamp(1.0 - (depthNorm - 0.15) * 0.58, 0.25, 1.0) : 1.0;

            const shimmer = 0.92 + 0.08 * Math.sin(normX * 8.0 + normY * 6.0 - t * 2.2);
            const effectiveDensity = clamp(cell.density * frontFactor * backDim * shimmer, 0.05, 1.0);

            let glyph = cell.char;
            if (cell.density < 0.72) {
              const rampIdx = clamp(Math.round(effectiveDensity * rampMax), 1, rampMax);
              glyph = DENSITY_RAMP[rampIdx];
            }

            const colorIdx = clamp(Math.floor(effectiveDensity * (palMax + 0.99)), 1, palMax);

            projected.push({
              z: zFinal,
              sx,
              sy,
              scale,
              glyph,
              color: palette[colorIdx],
            });
          }
        }

        // Back-to-front depth sort so foreground glyphs overlap background glyphs naturally
        projected.sort((a, b) => b.z - a.z);

        let lastFontSize = -1;
        for (let i = 0; i < projected.length; i++) {
          const item = projected[i];
          const fontSize = Math.max(6, Math.round(state.baseFontSize * item.scale));
          if (fontSize !== lastFontSize) {
            ctx.font = `700 ${fontSize}px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
            lastFontSize = fontSize;
          }
          ctx.fillStyle = item.color;
          ctx.fillText(item.glyph, item.sx, item.sy);
        }

        // Restore base font for next frame
        if (lastFontSize !== state.baseFontSize) {
          ctx.font = `700 ${state.baseFontSize}px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        }

        requestAnimationFrame(render);
      }

      window.addEventListener("load", () => {
        resize();
        state.startTime = performance.now();
        state.lastFrameTime = performance.now();
        requestAnimationFrame(render);
      });
    })();
  </script>
</body>
</html>
