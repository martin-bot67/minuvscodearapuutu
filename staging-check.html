<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staging Check</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .box {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 12px;
        padding: 32px 48px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }
      h1 { margin: 0 0 12px; }
      p { margin: 0; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Staging works</h1>
      <p>This file was uploaded to test the staging deployment.</p>
    </div>
  </body>
</html>
