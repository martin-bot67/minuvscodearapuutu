<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Eye — Symbol Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap');

    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #f8fafc;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    #eye-stage:fullscreen {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <div id="eye-stage" class="relative w-screen h-screen bg-black flex flex-col items-center justify-between p-2 sm:p-4 overflow-hidden">
    <!-- Top Bar: Fullscreen Button + Color Swatches -->
    <div class="z-10 flex flex-wrap items-center justify-center gap-2 bg-black/85 border border-neutral-800 rounded-xl px-3 py-2">
      <button id="btn-fullscreen" type="button" aria-pressed="false" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 hover:bg-neutral-800 text-white border border-neutral-700 transition cursor-pointer">
        <span id="fs-label">Fullscreen</span>
      </button>

      <div class="h-4 w-px bg-neutral-800 mx-0.5"></div>

      <button type="button" data-color="cyan" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-cyan-950 text-cyan-300 border border-cyan-500/70 transition cursor-pointer">
        Cyan
      </button>
      <button type="button" data-color="crimson" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-rose-300 border border-neutral-800 hover:border-rose-500/60 transition cursor-pointer">
        Crimson
      </button>
      <button type="button" data-color="emerald" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-emerald-300 border border-neutral-800 hover:border-emerald-500/60 transition cursor-pointer">
        Emerald
      </button>
      <button type="button" data-color="amber" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-amber-300 border border-neutral-800 hover:border-amber-500/60 transition cursor-pointer">
        Amber
      </button>
      <button type="button" data-color="violet" class="color-btn px-2.5 py-1.5 rounded-lg text-xs font-bold bg-neutral-900 text-violet-300 border border-neutral-800 hover:border-violet-500/60 transition cursor-pointer">
        Violet
      </button>
    </div>

    <!-- Centered Eye Canvas Wrapper -->
    <div id="canvas-wrap" class="relative flex-1 w-full max-w-[1900px] min-h-0 flex items-center justify-center my-1">
      <canvas id="eye-canvas"></canvas>
    </div>

    <!-- Bottom spacer for balanced centering -->
    <div class="h-1 w-full"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // Grid dimensions and character ramp
      const COLS = 136;
      const ROWS = 58;
      const RAMP = " .:-=+*#%@";
      const BG_COLOR = "#000000";
      const IRIS_R = 0.48;
      const BLINK_PERIOD = 4.5;
      const BLINK_DURATION = 0.28;

      // Color palettes for each iris theme
      const COLOR_THEMES = {
        cyan: {
          activeClasses: ["bg-cyan-950", "text-cyan-200", "border-cyan-400"],
          palette: ["#050811", "#172554", "#1d4ed8", "#0284c7", "#22d3ee", "#a5f3fc", "#f8fafc"],
        },
        crimson: {
          activeClasses: ["bg-rose-950", "text-rose-200", "border-rose-400"],
          palette: ["#0d0407", "#450a0a", "#991b1b", "#dc2626", "#f43f5e", "#fda4af", "#fff1f2"],
        },
        emerald: {
          activeClasses: ["bg-emerald-950", "text-emerald-200", "border-emerald-400"],
          palette: ["#030c08", "#064e3b", "#047857", "#059669", "#10b981", "#6ee7b7", "#ecfdf5"],
        },
        amber: {
          activeClasses: ["bg-amber-950", "text-amber-200", "border-amber-400"],
          palette: ["#0d0802", "#451a03", "#92400e", "#d97706", "#f59e0b", "#fcd34d", "#fffbeb"],
        },
        violet: {
          activeClasses: ["bg-violet-950", "text-violet-200", "border-violet-400"],
          palette: ["#080412", "#2e1065", "#5b21b6", "#7c3aed", "#a855f7", "#d8b4fe", "#faf5ff"],
        },
      };

      const ALL_ACTIVE_CLASSES = Object.values(COLOR_THEMES).flatMap((t) => t.activeClasses);

      // DOM lookups
      const stage = document.getElementById("eye-stage");
      const wrap = document.getElementById("canvas-wrap");
      const canvas = document.getElementById("eye-canvas");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const fsLabel = document.getElementById("fs-label");
      const colorButtons = Array.from(document.querySelectorAll(".color-btn"));

      if (!canvas || !wrap) return;
      const ctx = canvas.getContext("2d", { alpha: false });
      if (!ctx) return;

      // Animation state
      const state = {
        activeColor: "cyan",
        fallbackFullscreen: false,
        cssWidth: 1200,
        cssHeight: 600,
        cellW: 10,
        cellH: 10,
        startTime: performance.now(),
      };

      function clamp(val, lo, hi) {
        return val < lo ? lo : val > hi ? hi : val;
      }

      function getCurrentPalette() {
        const theme = COLOR_THEMES[state.activeColor] || COLOR_THEMES.cyan;
        return theme.palette;
      }

      // Color button selection
      function setColor(colorKey) {
        if (!COLOR_THEMES[colorKey]) return;
        state.activeColor = colorKey;

        colorButtons.forEach((btn) => {
          const isSelected = btn.dataset.color === colorKey;
          btn.classList.remove(...ALL_ACTIVE_CLASSES);
          if (isSelected) {
            btn.classList.remove("bg-neutral-900", "border-neutral-800");
            btn.classList.add(...COLOR_THEMES[colorKey].activeClasses);
          } else {
            btn.classList.add("bg-neutral-900", "border-neutral-800");
          }
        });
      }

      colorButtons.forEach((btn) => {
        btn.addEventListener("click", () => setColor(btn.dataset.color));
      });
      setColor("cyan");

      // Fullscreen handling with sandbox fallback
      function getFsElement() {
        return (
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement ||
          null
        );
      }

      function updateFsButton() {
        const active = Boolean(getFsElement()) || state.fallbackFullscreen;
        if (btnFullscreen) btnFullscreen.setAttribute("aria-pressed", String(active));
        if (fsLabel) fsLabel.textContent = active ? "Exit Fullscreen" : "Fullscreen";
        if (stage) {
          stage.classList.toggle("fixed", state.fallbackFullscreen && !getFsElement());
          stage.classList.toggle("inset-0", state.fallbackFullscreen && !getFsElement());
          stage.classList.toggle("z-50", state.fallbackFullscreen && !getFsElement());
        }
      }

      async function toggleFullscreen() {
        try {
          const current = getFsElement();
          if (current) {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            state.fallbackFullscreen = false;
            updateFsButton();
            resize();
            return;
          }

          if (state.fallbackFullscreen) {
            state.fallbackFullscreen = false;
            updateFsButton();
            resize();
            return;
          }

          const target = stage || canvas;
          if (target && target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target && target.webkitRequestFullscreen) {
            target.webkitRequestFullscreen();
          } else {
            state.fallbackFullscreen = true;
            updateFsButton();
            resize();
          }
        } catch (_err) {
          state.fallbackFullscreen = !state.fallbackFullscreen;
          updateFsButton();
          resize();
        }
      }

      if (btnFullscreen) {
        btnFullscreen.addEventListener("click", toggleFullscreen);
      }

      document.addEventListener("fullscreenchange", () => {
        if (!getFsElement()) state.fallbackFullscreen = false;
        updateFsButton();
        requestAnimationFrame(resize);
      });

      document.addEventListener("webkitfullscreenchange", () => {
        if (!getFsElement()) state.fallbackFullscreen = false;
        updateFsButton();
        requestAnimationFrame(resize);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.fallbackFullscreen && !getFsElement()) {
          state.fallbackFullscreen = false;
          updateFsButton();
          resize();
        }
      });

      // Responsive canvas sizing
      function resize() {
        const rect = wrap.getBoundingClientRect();
        const availW = Math.max(240, rect.width || window.innerWidth || 960);
        const availH = Math.max(160, rect.height || window.innerHeight || 480);

        // Fit 136x58 grid cleanly inside available box while preserving proportions
        const targetRatio = (COLS * 13) / (ROWS * 16);
        let drawW = availW;
        let drawH = drawW / targetRatio;

        if (drawH > availH) {
          drawH = availH;
          drawW = drawH * targetRatio;
        }

        const dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
        state.cssWidth = Math.floor(drawW);
        state.cssHeight = Math.floor(drawH);

        canvas.style.width = `${state.cssWidth}px`;
        canvas.style.height = `${state.cssHeight}px`;
        canvas.width = Math.round(state.cssWidth * dpr);
        canvas.height = Math.round(state.cssHeight * dpr);

        state.cellW = state.cssWidth / COLS;
        state.cellH = state.cssHeight / ROWS;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const fontSize = Math.max(7, Math.floor(Math.min(state.cellW * 1.15, state.cellH * 0.98)));
        ctx.font = `700 ${fontSize}px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
      }

      resize();
      window.addEventListener("resize", resize);
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(resize).observe(wrap);
      }

      // Render loop
      function render(now) {
        const t = (now - state.startTime) / 1000;
        const palette = getCurrentPalette();
        const rampMax = RAMP.length - 1;
        const palMax = palette.length - 2;

        const gazeX = Math.sin(t * 0.85) * 0.16 + Math.cos(t * 0.37) * 0.05;
        const gazeY = Math.sin(t * 0.62) * 0.10;
        const pupilR = clamp(0.18 + 0.025 * Math.sin(t * 1.9), 0.06, 0.34);

        const cycle = t % BLINK_PERIOD;
        const blink = cycle < BLINK_DURATION ? Math.pow(Math.sin((cycle / BLINK_DURATION) * Math.PI), 1.6) : 0.0;

        const glintX = -0.14 + gazeX * 0.45;
        const glintY = -0.13 + gazeY * 0.45;

        ctx.fillStyle = BG_COLOR;
        ctx.fillRect(0, 0, state.cssWidth, state.cssHeight);

        const cw = state.cellW;
        const ch = state.cellH;

        for (let r = 0; r < ROWS; r++) {
          const ny = ((r + 0.5) / ROWS) * 2.0 - 1.0;
          const cy = (r + 0.5) * ch;
          const absNy = Math.abs(ny);

          for (let c = 0; c < COLS; c++) {
            const nx = (((c + 0.5) / COLS) * 2.0 - 1.0) * 1.45;
            const cx = (c + 0.5) * cw;

            const lidEnv = Math.pow(Math.max(0.0, 1.0 - Math.pow(nx / 1.3, 2)), 0.54);
            const maxY = 0.74 * lidEnv * (1.0 - 0.94 * blink);
            const distToLid = maxY - absNy;

            let glyph = " ";
            let fill = palette[0];

            if (distToLid < 0.0) {
              const lidShade = clamp(0.16 + 0.2 * (1.0 - absNy), 0.0, 0.5);
              glyph = RAMP[Math.floor(lidShade * rampMax)];
              fill = distToLid > -0.065 ? "#1e293b" : "#06080d";
            } else {
              const dx = nx - gazeX;
              const dy = ny - gazeY;
              const dist = Math.hypot(dx, dy);
              const angle = Math.atan2(dy, dx);
              const edgeShadow = clamp(distToLid / 0.16, 0.25, 1.0);

              const glintD = Math.hypot((nx - glintX) * 1.08, (ny - glintY) * 1.08);
              if (glintD < 0.095) {
                glyph = "@";
                fill = "#ffffff";
              } else if (dist < pupilR) {
                const ring = Math.abs(dist - pupilR * 0.85) < 0.016 ? 0.15 : 0.0;
                const intensity = clamp(0.08 + ring, 0.0, 1.0);
                glyph = RAMP[Math.floor(intensity * rampMax)];
                fill = ring > 0 ? "#1e293b" : "#000000";
              } else if (dist < IRIS_R) {
                const fiber = 0.5 + 0.5 * Math.sin(angle * 28.0 + dist * 24.0 + t * 0.6);
                const radial = 1.0 - ((dist - pupilR) / Math.max(0.001, IRIS_R - pupilR)) * 0.45;
                const limbal = (IRIS_R - dist) < 0.04 ? 0.55 : 1.0;
                const intensity = clamp((0.35 + 0.55 * fiber) * radial * limbal * edgeShadow, 0.1, 0.95);
                glyph = RAMP[Math.floor(intensity * rampMax)];
                const colorIdx = clamp(Math.floor(intensity * palMax) + 1, 1, palMax);
                fill = palette[colorIdx];
              } else {
                const sphereZ = Math.max(0.0, 1.0 - Math.pow(nx / 1.32, 2) - Math.pow(ny / 0.78, 2));
                const veinHint = 0.04 * Math.max(0.0, Math.sin(angle * 14.0 + dist * 9.0));
                const intensity = clamp((0.45 + 0.45 * Math.sqrt(sphereZ) - veinHint) * edgeShadow, 0.15, 0.92);
                glyph = RAMP[Math.floor(intensity * rampMax)];
                fill = intensity > 0.68 ? "#e2e8f0" : "#94a3b8";
              }
            }

            if (glyph !== " ") {
              ctx.fillStyle = fill;
              ctx.fillText(glyph, cx, cy);
            }
          }
        }

        requestAnimationFrame(render);
      }

      window.addEventListener("load", () => {
        resize();
        state.startTime = performance.now();
        requestAnimationFrame(render);
      });
    })();
  </script>
</body>
</html>
